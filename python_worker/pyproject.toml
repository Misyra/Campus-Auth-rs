[project]
name = "campus-auth-worker"
version = "5.0.0-alpha.8"
description = "Campus-Auth 浏览器自动化 Python Worker（NDJSON IPC 子进程）"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # 上界防未来大版本静默破坏（press_sequentially/CDP snapshot 等行为面），
    # 升级走 uv lock + 回归测试
    "playwright>=1.40,<2",
]

# OCR 为显式可选能力；锁文件保留该 extra，但默认同步不安装，应用按用户偏好启用。
[project.optional-dependencies]
ocr = [
    "ddddocr>=1.6.1",
]

# 开发/测试依赖：仅用于本仓库单元测试，不随运行时安装
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
campus-auth-worker = "worker_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "worker_main.py",
    "playwright_worker.py",
    "step_handlers.py",
    "variable_resolver.py",
    "models.py",
    "ocr_runtime.py",
    "debug_session.py",
]

# uv 镜像源配置：使用清华大学 PyPI 镜像加速依赖下载
[tool.uv]

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 根目录加入 sys.path，使 tests/ 可直接导入 models / variable_resolver 等顶层模块
pythonpath = ["."]