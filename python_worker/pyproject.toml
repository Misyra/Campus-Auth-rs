[project]
name = "campus-auth-worker"
version = "1.0.0"
description = "Campus-Auth 浏览器自动化 Python Worker（NDJSON IPC 子进程）"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # 上界防未来大版本静默破坏（press_sequentially/CDP snapshot 等行为面），
    # 升级走 uv lock + 回归测试
    "playwright>=1.40,<2",
]

# 开发/测试依赖：仅用于本仓库单元测试，不随运行时安装
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
campus-auth-worker = "worker_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# wheel 打包面：仓库根全部 .py 模块（组装门面 + 伴生 Mixin）直落 wheel 根，
# 供 entry point `worker_main:main` 与 Rust 环境探针导入。hatchling 两个语义坑
# （tests/test_wheel_packaging.py 钉住）：
# - packages / only-include 会整体压掉 include——先前 `packages = ["."]` 配
#   只列 7 个文件的 include 时 include 是死配置，实际打进的是全部跟踪文件；
# - 通配 * 可跨越路径分隔符，未锚定的 *.py 会把 tests/ 一并带入，故用 / 锚定顶层
[tool.hatch.build.targets.wheel]
include = ["/*.py"]

# uv 镜像源配置：使用清华大学 PyPI 镜像加速依赖下载
[tool.uv]

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 根目录加入 sys.path，使 tests/ 可直接导入 models / variable_resolver 等顶层模块
pythonpath = ["."]
