[package]
name = "campus-auth"
version = "5.2.0-beta.2"
edition = "2024"
rust-version = "1.91"
default-run = "campus-auth"
description = "认证喵 — 校园网自动认证工具（Rust 重写版）"
authors = ["Misyra"]
license = "AGPL-3.0-only"

[[bin]]
name = "campus-auth"
path = "src/main.rs"

[[bin]]
name = "campus-auth-helper"
path = "src/helper_main.rs"

[lib]
# lib 保留供桌面单测与集成测试；cdylib 供安卓侧经 JNI 加载（cargo-ndk 产物）
crate-type = ["lib", "cdylib"]

[features]
default = ["desktop"]
# OpenWrt 使用 --no-default-features --features openwrt，避免链接 GTK 等桌面库。
# 安卓使用 --no-default-features --features android，同样免桌面依赖（托盘/通知降级见各 cfg 门）。
desktop = ["dep:tray-icon", "dep:image", "dep:gtk"]
openwrt = []
android = []
no-embed = []

[dependencies]
# 异步运行时 & 网络
# feature 按实际使用裁剪（原 full）：rt-multi-thread 多线程 runtime、macros
# 属性宏、net Tcp 监听/探测、fs 配置落盘、process Worker 子进程、signal
# ctrl_c、sync channel/锁、time 定时与超时、io-util 异步读写扩展
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "process",
    "signal",
    "sync",
    "time",
    "io-util",
] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy", "cookies", "socks"] }
socket2 = { version = "0.6", features = ["all"] }
percent-encoding = "2"

# HTTP 框架 & 中间件
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "set-header"] }

# 序列化 & 数据
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
num-bigint = "0.5"

# 配置 & 状态
arc-swap = "1"

# 加密 & 安全
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive", "alloc", "serde"] }
rand = "0.8"
# 发布清单 ed25519 离线签名（T6-4）：release 流水线签清单 + 客户端嵌公钥严格校验。
# 纯 Rust 实现（无 C 依赖）；密钥生成直接用 rand 的 OsRng 填 32 字节种子，无需 rand_core 特性。
# zeroize 显式声明防漂移：它是 2.x 的默认特性（SigningKey 的 ZeroizeOnDrop 私钥
# drop 清零依赖它），上游若收缩默认特性集，隐式依赖会静默失去该保证
ed25519-dalek = { version = "2", features = ["zeroize"] }

# CLI & 日志
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "time", "local-time"] }
tracing-appender = "0.2"

# 错误处理
thiserror = "2"
anyhow = "1"

# 时间 & 调度
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cron = "0.13"

# 系统 & 桌面
tray-icon = { version = "0.24", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
open = "5"
fs4 = { version = "1", features = ["tokio"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# zip 仅用于读取发布包（deflate/stored）；默认 features 会拉入 lzma/bzip2/zstd
# 三个 C 依赖，_unix 交叉编译与构建速度都受累
zip = { version = "2", default-features = false, features = ["deflate"] }

# 网络 & 硬件
# （网卡检测自研实现，无 mac_address 依赖）

# 工具 & 更新
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
which = "7"
hex = "0.4"
self-replace = "1"

# 直连登录：散列/编码内置函数
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
regex = "1"

# 直连登录：用户加密脚本（内嵌 JS 引擎，纯 Rust 无 C 依赖）
boa_engine = "0.22"
tempfile = "3"
url = "2"

# Trait
async-trait = "0.1"

# API 契约生成（阶段 5 T5-0）：`#[utoipa::path]` 注解 → OpenAPI 文档生成。
# 版本选 5.x 线：axum_extras 特性在 5.5 要求 axum ^0.8，与本仓 axum 0.8 匹配
# （6.0 为另一代大版本，本战役不追）。axum_extras 让 Query/Path 提取器
# 参与参数 schema 推导
utoipa = { version = "5.5", features = ["axum_extras"] }
# 配置树 JSON Schema 导出（schemars 1.x 稳定线，MSRV 1.74 < 本仓 1.91）；
# 仅用于 config 持久化树的契约快照，与 utoipa 的 ToSchema 体系互不复用
schemars = "1.2"

# 嵌入
rust-embed = { version = "8", features = ["include-exclude"] }

# 编码
encoding_rs = "0.8"

# 归档解压：uv 引导与自更新在 unix 平台的发布资产为 tar.gz（官方 zip 资产仅有 Windows），
# 与 zip crate 并列，按资产扩展名分派
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# Unix 平台系统调用（进程存活探测 kill(pid,0)）与 macOS F_FULLFSYNC 持久化保证
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# tray-icon Windows 平台实现靠隐藏窗口的窗口过程处理 WM_USER_TRAYICON，
# 应用必须自行 pump 消息循环，否则托盘点击与菜单事件均不会触发。
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    # 卸载结果使用带折叠详情的系统任务对话框。
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    # GUI 子系统下重新附着父控制台（AttachConsole / SetStdHandle）
    "Win32_System_Console",
    "Win32_Networking_WinSock",
    # 自启动状态使用原生注册表读取，保留访问拒绝与值不存在的区别。
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Shell",
    # CONOUT$ 标准句柄重建（CreateFileW）
    "Win32_Storage_FileSystem",
    # 孤儿浏览器清理的 kill 前复核：CreateToolhelp32Snapshot 读实时父 PID
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon Linux 后端要求 gtk::init 与 gtk 主循环运行在同一线程，
# 托盘/菜单事件经 glib 主循环分发（与 tray-icon 内部依赖同版本，共享 gtk 状态）
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 托盘启用（架构批）：主线程交还 AppKit 事件循环（NSApplication run loop），
# 托盘/菜单构建与动态更新经 GCD 主队列投递。版本与 tray-icon 0.24 / muda 0.19
# 内部的 objc2 依赖线严格同版（objc2 0.6 / 框架 crate 0.3），避免大范围 update。
# dispatch2 即 objc2 生态的 dispatch 绑定（上游 crates.io 无 objc2-dispatch 包名，
# 该项目内 crate 实名 dispatch2；0.3.1 已随 objc2-core-foundation 传入锁文件，
# 显式声明不引入新版本解析）。AppKit 只启用本仓用到的三个模块特性，
# NSResponder 是 generated 代码中 NSApplication impl 块的编译门槛
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
] }
# MainThreadMarker（AppKit 主线程标记）经 objc2 直接暴露；与 tray-icon / muda
# 各自声明的 objc2 0.6 同线，锁文件无新增解析
objc2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(not(target_os = "android"))'.dependencies]
# 系统通知（os 通道）：Windows toast / macOS 通知中心 / Linux freedesktop 由它统一实现
# 安卓端无桌面通知基础设施，不参与构建（os 通道发送恒失败静默，见 notification/sender.rs）
# 默认特性仅 "z"——Linux 走纯 Rust zbus 客户端（无需 libdbus C 库）；显式关掉
# default 并点名 "z"，防未来默认特性膨胀（如 images 会拉 rayon 与全套图像解码）
notify-rust = { version = "4.19", default-features = false, features = ["z"] }

[target.'cfg(target_os = "android")'.dependencies]
# 安卓端 JNI 绑定（P0 编译门）：启动层经 JNI 注入应用私有目录等环境信息
jni = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tower = { version = "0.5", features = ["util"] }
# 集成测试构造真实发布包结构（上传路径会真的解压并校验 extracted exe 存在）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 属性测试：NDJSON IPC 解析与登录抢占决策的高风险纯逻辑面（随机输入 + shrink）
proptest = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[build-dependencies]
# 为 Windows 主程序和助手嵌入可被手动更新识别的版本资源。
winresource = "0.1.31"
# 构建期完整解析待嵌入的清单签名公钥（VerifyingKey::from_bytes 校验曲线点
# 合法性）：形态检查拦不住"合法 base64 但非法公钥"的损坏文件，那类文件会在
# 运行期解析失败而 fail-open 降级为不校验签名，必须在构建期 fail-closed
ed25519-dalek = "2"
base64 = "0.22"
