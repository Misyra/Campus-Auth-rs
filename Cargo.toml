[package]
name = "campus-auth"
version = "5.0.0-alpha.2"
edition = "2024"
rust-version = "1.85"
default-run = "campus-auth"
description = "校园网自动认证工具 — Rust 重写版"
authors = ["Misyra"]
license = "MIT"

[[bin]]
name = "campus-auth"
path = "src/main.rs"

[[bin]]
name = "campus-auth-helper"
path = "src/helper_main.rs"

[features]
default = []
no-embed = []

[dependencies]
# 异步运行时 & 网络
# feature 按实际使用裁剪（原 full）：rt-multi-thread 多线程 runtime、macros
# 属性宏、net Tcp 监听/探测、fs 配置落盘、process Worker 子进程、signal
# ctrl_c、sync channel/锁、time 定时与超时、io-util 异步读写扩展
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "process",
    "signal",
    "sync",
    "time",
    "io-util",
] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# HTTP 框架 & 中间件
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "set-header"] }

# 序列化 & 数据
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# 配置 & 状态
arc-swap = "1"

# 加密 & 安全
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive", "alloc", "serde"] }
rand = "0.8"

# CLI & 日志
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "time", "local-time"] }
tracing-appender = "0.2"

# 错误处理
thiserror = "2"
anyhow = "1"

# 时间 & 调度
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cron = "0.13"

# 系统 & 桌面
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
fs4 = { version = "1", features = ["tokio"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# zip 仅用于读取发布包（deflate/stored）；默认 features 会拉入 lzma/bzip2/zstd
# 三个 C 依赖，_unix 交叉编译与构建速度都受累
zip = { version = "2", default-features = false, features = ["deflate"] }

# 网络 & 硬件
# （网卡检测自研实现，无 mac_address 依赖）

# 工具 & 更新
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
which = "7"
hex = "0.4"
self-replace = "1"
tempfile = "3"
url = "2"

# Trait
async-trait = "0.1"

# 嵌入
rust-embed = { version = "8", features = ["include-exclude"] }

# 编码
encoding_rs = "0.8"

# 归档解压：uv 引导与自更新在 unix 平台的发布资产为 tar.gz（官方 zip 资产仅有 Windows），
# 与 zip crate 并列，按资产扩展名分派
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# Unix 平台系统调用（进程存活探测 kill(pid,0)）与 macOS F_FULLFSYNC 持久化保证
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# tray-icon Windows 平台实现靠隐藏窗口的窗口过程处理 WM_USER_TRAYICON，
# 应用必须自行 pump 消息循环，否则托盘点击与菜单事件均不会触发。
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    # GUI 子系统下重新附着父控制台（AttachConsole / SetStdHandle）
    "Win32_System_Console",
    # CONOUT$ 标准句柄重建（CreateFileW）
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# tray-icon Linux 后端要求 gtk::init 与 gtk 主循环运行在同一线程，
# 托盘/菜单事件经 glib 主循环分发（与 tray-icon 内部依赖同版本，共享 gtk 状态）
gtk = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
