name: finalize-browser-install-timeout

on:
  push:
    branches:
      - fix/playwright-browser-install

permissions:
  contents: write

concurrency:
  group: finalize-browser-install-timeout
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/playwright-browser-install

      - name: 对齐前后端安装超时预算
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/views/settings/BrowserSettings.vue')
          text = path.read_text(encoding='utf-8')
          old = 'const deadline = Date.now() + 10 * 60 * 1000;'
          new = 'const deadline = Date.now() + 31 * 60 * 1000;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one timeout anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 验证生产构建
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 提交并删除辅助 workflow
        run: |
          git config user.name "Misyra"
          git config user.email "140050141+Misyra@users.noreply.github.com"
          git add frontend/src/views/settings/BrowserSettings.vue
          git rm .github/workflows/finalize-browser-install-timeout.yml
          git commit -m "fix: 对齐浏览器安装等待预算"
          git push origin HEAD:fix/playwright-browser-install
