name: finalize-browser-install-dedup

on:
  push:
    branches:
      - fix/playwright-browser-install

permissions:
  contents: write

concurrency:
  group: finalize-browser-install-dedup
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/playwright-browser-install

      - name: 去重首次 Chromium 安装
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/web/routes/system.rs")
          text = path.read_text(encoding="utf-8")

          old_helper = '''fn normalize_playwright_browser(browser: Option<&str>) -> Result<String, ApiError> {
              let browser = browser.unwrap_or("chromium").trim().to_ascii_lowercase();
              if matches!(browser.as_str(), "chromium" | "firefox" | "webkit") {
                  Ok(browser)
              } else {
                  Err(ApiError::BadRequest(format!(
                      "不支持安装浏览器 {browser:?}，仅支持 chromium/firefox/webkit"
                  )))
              }
          }
          '''
          new_helper = old_helper + '''
          fn should_explicitly_install_after_ensure(browser: &str, core_was_ready: bool) -> bool {
              browser != "chromium" || core_was_ready
          }
          '''
          if text.count(old_helper) != 1:
              raise SystemExit(f"normalize helper anchor count={text.count(old_helper)}")
          text = text.replace(old_helper, new_helper, 1)

          old_handler = '''    let browser = normalize_playwright_browser(params.browser.as_deref())?;
              let env = environment.clone();
              let install_target = browser.clone();
              tokio::spawn(async move {
                  if let Err(e) = env.ensure_capability().await {
                      tracing::error!("Playwright 核心环境安装失败: {e}");
                      return;
                  }
                  if let Err(e) = env.install_playwright_browser(&install_target).await {
                      tracing::error!("Playwright {install_target} 安装失败: {e}");
                  }
              });
          '''
          new_handler = '''    let browser = normalize_playwright_browser(params.browser.as_deref())?;
              let env = environment.clone();
              let install_target = browser.clone();
              let core_was_ready = environment.status().capability_ready;
              tokio::spawn(async move {
                  if let Err(e) = env.ensure_capability().await {
                      tracing::error!("Playwright 核心环境安装失败: {e}");
                      return;
                  }
                  if should_explicitly_install_after_ensure(&install_target, core_was_ready) {
                      if let Err(e) = env.install_playwright_browser(&install_target).await {
                          tracing::error!("Playwright {install_target} 安装失败: {e}");
                      }
                  }
              });
          '''
          if text.count(old_handler) != 1:
              raise SystemExit(f"handler anchor count={text.count(old_handler)}")
          text = text.replace(old_handler, new_handler, 1)

          marker = '    // ============ tracing JSON 日志解析 ============\n'
          test = '''    #[test]
              fn playwright_browser_install_decision_avoids_first_chromium_duplicate() {
                  assert!(!should_explicitly_install_after_ensure("chromium", false));
                  assert!(should_explicitly_install_after_ensure("chromium", true));
                  assert!(should_explicitly_install_after_ensure("firefox", false));
                  assert!(should_explicitly_install_after_ensure("webkit", false));
              }

          '''
          if text.count(marker) != 1:
              raise SystemExit(f"test marker count={text.count(marker)}")
          path.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")
          '@ | Set-Content .github/finalize-browser-install-dedup.py -Encoding utf8
          python .github/finalize-browser-install-dedup.py

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端资源
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: 格式化与定向测试
        run: |
          cargo fmt
          cargo test playwright_browser --lib

      - name: 提交并删除辅助文件
        shell: pwsh
        run: |
          git config user.name "Misyra"
          git config user.email "140050141+Misyra@users.noreply.github.com"
          git add src/web/routes/system.rs
          git rm .github/workflows/finalize-browser-install-dedup.yml
          Remove-Item .github/finalize-browser-install-dedup.py
          git commit -m "fix: 避免首次重复安装 Chromium"
          git push origin HEAD:fix/playwright-browser-install
