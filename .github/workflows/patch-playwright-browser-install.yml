name: patch-playwright-browser-install

on:
  push:
    branches:
      - fix/playwright-browser-install

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/playwright-browser-install
          fetch-depth: 0

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: 收紧前端轮询类型并应用目标补丁
        shell: pwsh
        run: |
          $path = ".github/scripts/patch-playwright-browser-install.py"
          $text = Get-Content $path -Raw
          $text = $text.Replace('await new Promise((resolve) => window.setTimeout(resolve, 1500));', 'await new Promise<void>((resolve) => window.setTimeout(resolve, 1500));')
          Set-Content -Path $path -Value $text -Encoding utf8
          python $path

      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Rust 格式化与定向测试
        run: |
          cargo fmt
          cargo test playwright_browser --lib

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端构建与测试
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

      - name: 提交并删除辅助文件
        shell: pwsh
        run: |
          git config user.name "Misyra"
          git config user.email "140050141+Misyra@users.noreply.github.com"
          git add src/environment/python.rs src/environment/mod.rs src/web/routes/ocr.rs src/web/routes/system.rs frontend/src/api/index.ts frontend/src/views/settings/BrowserSettings.vue
          git rm .github/scripts/patch-playwright-browser-install.py .github/workflows/patch-playwright-browser-install.yml
          git commit -m "fix: 支持按需安装 Playwright 浏览器"
          git push origin HEAD:fix/playwright-browser-install
