name: ocr-optional-patch

on:
  push:
    branches:
      - fix/optional-ocr-dependency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/optional-ocr-dependency
          fetch-depth: 0

      - name: 应用可选 OCR 依赖补丁
        run: python .github/scripts/patch_ocr_optional.py

      - name: 安装 uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.6"

      - name: 重算 Python 锁文件
        run: uv lock --project python_worker

      - name: 校验默认同步不安装 OCR extra
        shell: bash
        run: |
          uv sync --project python_worker --dev --frozen
          uv run --project python_worker --no-sync python -c "import importlib.util; assert importlib.util.find_spec('ddddocr') is None, '默认 sync 不应安装 ddddocr'"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Rust 格式化
        run: cargo fmt

      - name: 提交可选依赖改造并移除辅助文件
        shell: bash
        run: |
          git config user.name "Misyra"
          git config user.email "140050141+Misyra@users.noreply.github.com"
          git add python_worker/pyproject.toml python_worker/uv.lock src/environment/python.rs src/environment/uv.rs src/web/routes/ocr.rs
          git rm .github/workflows/ocr-optional-patch.yml .github/scripts/patch_ocr_optional.py
          git commit -m "fix: 将 OCR 改为显式可选依赖"
          git push origin HEAD:fix/optional-ocr-dependency
