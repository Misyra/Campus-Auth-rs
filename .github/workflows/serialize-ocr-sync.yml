name: serialize-ocr-sync

on:
  push:
    branches:
      - fix/optional-ocr-dependency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/optional-ocr-dependency
          fetch-depth: 0

      - name: 串行化 OCR sync
        run: python .github/scripts/serialize_ocr_sync.py

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: 格式化并检查
        run: cargo fmt --check || cargo fmt

      - name: 提交并删除辅助文件
        shell: bash
        run: |
          git config user.name "Misyra"
          git config user.email "140050141+Misyra@users.noreply.github.com"
          git add src/environment/mod.rs
          git rm .github/workflows/serialize-ocr-sync.yml .github/scripts/serialize_ocr_sync.py
          git commit -m "fix: 串行化 OCR 环境依赖同步"
          git push origin HEAD:fix/optional-ocr-dependency
