name: recorder-targeted-patch-v3

on:
  push:
    branches:
      - fix/task-recorder-contract

permissions:
  contents: write

jobs:
  patch-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/task-recorder-contract
          fetch-depth: 0

      - name: 复用已验证补丁并修正最后锚点
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/recorder-targeted-patch-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = textwrap.dedent(workflow[start:end])
          old = '''replace_once(
              "  function generatePrompt(pageUrl) {",
              '  function generatePrompt(pageUrl) {\\n    pageUrl = sanitizeAttributeValue("href", pageUrl);',
              "prompt page url",
          )'''
          new = '''replace_once(
              "  function generatePrompt(url) {",
              '  function generatePrompt(url) {\\n    url = sanitizeAttributeValue("href", url);',
              "prompt page url",
          )'''
          if code.count(old) != 1:
              raise SystemExit(f'prompt anchor patch: expected 1, got {code.count(old)}')
          code = code.replace(old, new, 1)
          exec(compile(code, '<recorder-targeted-patch-v2>', 'exec'), {})
          PY

      - name: 校验 userscript 语法
        run: node --check resources/tools/task-recorder.user.js

      - name: 提交修复并移除临时 workflow
        shell: bash
        run: |
          git config user.name "Misyra"
          git config user.email "140050141+Misyra@users.noreply.github.com"
          git add resources/tools/task-recorder.user.js
          git rm .github/workflows/recorder-targeted-patch.yml .github/workflows/recorder-targeted-patch-v2.yml .github/workflows/recorder-targeted-patch-v3.yml
          git commit -m "fix: 加固任务录制器隐私与智能检测"
          git push origin HEAD:fix/task-recorder-contract
