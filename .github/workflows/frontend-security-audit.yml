name: frontend-security-audit

on:
  push:
    branches:
      - chore/frontend-security-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装锁定依赖
        working-directory: frontend
        run: npm ci

      - name: 输出 npm audit 依赖链
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const audit = require('./audit.json');
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: v.severity,
              direct: v.isDirect,
              range: v.range,
              nodes: v.nodes,
              via: (v.via || []).map(x => typeof x === 'string' ? x : ({
                source: x.source,
                name: x.name,
                severity: x.severity,
                title: x.title,
                url: x.url,
                range: x.range,
              })),
              effects: v.effects,
              fixAvailable: v.fixAvailable,
            }));
          }
          NODE
