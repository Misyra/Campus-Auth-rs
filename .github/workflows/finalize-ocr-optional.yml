name: finalize-ocr-optional

on:
  push:
    branches:
      - fix/optional-ocr-dependency

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/optional-ocr-dependency
          fetch-depth: 0

      - name: 应用收尾补丁
        run: python .github/scripts/finalize_ocr_optional.py

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Rust 格式化
        run: cargo fmt

      - name: 提交并删除辅助文件
        shell: bash
        run: |
          git config user.name "Misyra"
          git config user.email "140050141+Misyra@users.noreply.github.com"
          git add src/environment/uv.rs src/environment/mod.rs src/environment/bootstrap.rs
          git rm .github/workflows/finalize-ocr-optional.yml .github/scripts/finalize_ocr_optional.py
          git commit -m "fix: 保留 OCR 安装偏好事务语义"
          git push origin HEAD:fix/optional-ocr-dependency
