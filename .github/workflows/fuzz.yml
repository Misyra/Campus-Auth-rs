name: Fuzz

# cargo-fuzz 定期冒烟：三个 target 各跑固定短时长，验证「可编译、可执行、
# 无崩溃」并持续积累语料；深跑（小时级 + 持久 corpus）留给本地手动执行，
# 见 fuzz/README.md。不进主 ci.yml（PR 每跑会拖慢主链路）。

on:
  schedule:
    # 每周一 03:00 UTC（北京时间周一 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 每个 target 的 fuzz 时长（秒）
        required: false
        default: "180"

# 只拉代码跑 fuzz，无发布/推包需求，GITHUB_TOKEN 收敛为只读
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: Fuzz Smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse_ipc, fuzz_config_json, fuzz_migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-fuzz 构建需要 nightly + rust-src（-Z sanitizer 相关开关）
      - name: 安装 Rust nightly 工具链
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
          components: rust-src

      # fuzz/ 是独立 crate（独立 lockfile），单独按其 workspace 缓存构建产物；
      # 语料目录不缓存（冒烟语料可快速重建，缓存会无限膨胀）
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            fuzz

      - name: 安装 cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz

      # 冒烟参数口径：-max_total_time 固定短时长（手动 dispatch 可加大）；
      # -max_len 16384 覆盖配置/IPC 行的真实尺寸量级；ASan + rss 限制兜底
      - name: Fuzz 冒烟（限时长）
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ inputs.max_total_time || '180' }} \
            -max_len=16384 \
            -rss_limit_mb=2560

      # 发现崩溃时把复现输入（libFuzzer crash artifact）带上，便于本地回放
      - name: 上传崩溃产物
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
