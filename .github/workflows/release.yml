name: Release

# 便携版发布流水线：推送 v* 标签触发，三平台产物直接上传到 GitHub Release。
#
# 产物与 build.ps1 口径一致（解压即用）：
#   campus-auth(-helper)(.exe)  # 主程序（前端已嵌入）+ 更新替换助手
#   resources/                  # 托盘图标 / task-recorder 等静态资源
#   src/ + frontend/ + Cargo 清单 # Dockerfile 的最小源码构建上下文
#   python_worker/              # Python Worker 源码（运行时按需引导 uv 环境）
#   Dockerfile / docker-compose*.yml / .dockerignore / docker/  # Docker 部署与源码构建覆盖
#   README.md                     # 快速开始
#
# 矩阵：Windows x64 / Windows arm64（MSVC 目标由 windows runner 自带工具链交叉编译）/
# macOS arm64 / macOS x64（Apple Silicon 主机交叉编译，规避 Intel 云主机退役风险）/
# Linux x64（ubuntu-22.04，较旧 glibc 兼容更多发行版）/
# Linux arm64（ubuntu-24.04-arm 原生 runner：tray-icon/GTK 在原生环境直接链接，
# 交叉链接缺 aarch64 GTK 库故不用交叉路线；updater 的 linux-arm64 平台键已就绪）。

on:
  push:
    tags: ["v*"]

# gh release create/upload 需要写权限
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

    env:
      RELEASE_TARGET: ${{ matrix.target }}
      ARCHIVE: campus-auth-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 读取 Rust 工具链版本
        id: rust-toolchain
        shell: pwsh
        run: |
          $config = Get-Content rust-toolchain.toml -Raw
          if ($config -notmatch 'channel\s*=\s*"([^"]+)"') {
            throw "rust-toolchain.toml 缺少 toolchain.channel"
          }
          "channel=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      # tray-icon 的 Linux 后端链接 GTK3 / appindicator / xdo（muda 菜单模拟点击），
      # 构建期需要 -dev 头文件
      - name: 安装 Linux 托盘构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 默认特性的 rust-embed 编译需要 frontend/dist；嵌入必须走真实生产构建
      - name: 构建前端资源
        working-directory: frontend
        run: npm ci && npm run build

      # 版本号规范（AGENTS.md）：tag 与 Cargo.toml 必须一致，防错 tag 发错版
      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $cargo) { throw "Cargo.toml 缺少 version 字段" }
          if ($tag -ne $cargo) {
            throw "tag $env:GITHUB_REF_NAME 与 Cargo.toml version=$cargo 不一致，请先同步版本号"
          }

      - name: Release 构建
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 组装口径与 build.ps1 一致；额外排除 __pycache__（运行时自动再生）
      - name: 组装便携包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "pkg"
          New-Item -ItemType Directory -Path "$out/python_worker" | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/campus-auth.exe" $out
          Copy-Item "target/$env:RELEASE_TARGET/release/campus-auth-helper.exe" $out
          Copy-Item "resources" "$out/resources" -Recurse
          Copy-Item "src" "$out/src" -Recurse
          New-Item -ItemType Directory -Path "$out/frontend" | Out-Null
          Get-ChildItem "frontend" -Force |
            Where-Object { $_.Name -notin @("node_modules", "dist", ".vite", "coverage") } |
            ForEach-Object { Copy-Item $_.FullName (Join-Path "$out/frontend" $_.Name) -Recurse -Force }
          foreach ($file in @("Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "openapi.json")) {
            Copy-Item $file "$out/$file" -Force
          }
          New-Item -ItemType Directory -Path "$out/docs/guides" -Force | Out-Null
          foreach ($doc in @("updatelog.md", "changelog.md", "known-issues.md")) {
            Copy-Item "docs/$doc" "$out/docs/$doc" -Force
          }
          Copy-Item "docs/guides/*.md" "$out/docs/guides" -Force
          Get-ChildItem "python_worker" -Force | Where-Object { $_.Name -ne ".venv" } |
            ForEach-Object { Copy-Item $_.FullName (Join-Path "$out/python_worker" $_.Name) -Recurse -Force }
          Get-ChildItem "$out/python_worker" -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          foreach ($d in @(".pytest_cache", ".tmp-uv-cache", ".mypy_cache", ".ruff_cache", "captures", "build", "dist", "node_modules")) {
            Get-ChildItem "$out/python_worker" -Recurse -Directory -Filter $d -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path "$out/python_worker/$d") { Remove-Item "$out/python_worker/$d" -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem "$out/python_worker" -Recurse -File -Filter "*.pyc" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Copy-Item "Dockerfile" "$out" -Force
          Copy-Item "docker-compose.yml" "$out" -Force
          Copy-Item "docker-compose.build.yml" "$out" -Force
          Copy-Item ".dockerignore" "$out" -Force
          Copy-Item "README.md" "$out/README.md" -Force
          Copy-Item "LICENSE" "$out/LICENSE" -Force
          Copy-Item "docker" "$out/docker" -Recurse -Force
          Compress-Archive -Path "$out/*" -DestinationPath $env:ARCHIVE

      - name: 组装便携包（macOS / Linux）
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/python_worker
          cp "target/$RELEASE_TARGET/release/campus-auth" pkg/
          cp "target/$RELEASE_TARGET/release/campus-auth-helper" pkg/
          cp -R resources pkg/resources
          cp -R src pkg/src
          mkdir -p pkg/frontend
          tar -C frontend --exclude=node_modules --exclude=dist --exclude=.vite --exclude=coverage -cf - . | tar -C pkg/frontend -xf -
          cp Cargo.toml Cargo.lock rust-toolchain.toml openapi.json pkg/
          mkdir -p pkg/docs/guides
          cp docs/updatelog.md docs/changelog.md docs/known-issues.md pkg/docs/
          cp docs/guides/*.md pkg/docs/guides/
          tar -C python_worker --exclude=.venv --exclude=__pycache__ --exclude=.pytest_cache --exclude=.tmp-uv-cache --exclude=.mypy_cache --exclude=.ruff_cache --exclude=captures --exclude=build --exclude=dist --exclude=node_modules --exclude='*.pyc' -cf - . | tar -C pkg/python_worker -xf -
          cp Dockerfile docker-compose.yml docker-compose.build.yml .dockerignore README.md LICENSE pkg/
          cp -R docker pkg/docker
          tar -czf "$ARCHIVE" -C pkg .

      # 生成 SHA256 校验文件（更新器按 SHA 校验完整性的前置数据）；mac 无 sha256sum，回退 shasum
      - name: 生成 SHA256
        if: runner.os != 'Windows'
        run: (sha256sum "$ARCHIVE" 2>/dev/null || shasum -a 256 "$ARCHIVE") > "$ARCHIVE.sha256"

      - name: 生成 SHA256（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower()
          # -NoNewline：与 sha256sum 标准两空格格式对齐，避免 CRLF 干扰校验工具
          [System.IO.File]::WriteAllText("$env:ARCHIVE.sha256", "$hash  $env:ARCHIVE")

      # Release 创建存在并发竞态（六个 job 同时打首个包）：
      # 只在已存在时容忍 create 竞态，其他失败不得被吞掉
      # 发布说明 = 本版更新日志（docs/updatelog.md 对应章节）+ 三端运行前提；
      # 六个 job 算出同一份内容，首个 create 生效（macOS quarantine 指引 W9、Linux GTK 依赖 W8）
      - name: 上传到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          section="$(awk -v tag="$GITHUB_REF_NAME" '/^## /{t=substr($0,4); n=substr(t,length(tag)+1,1); on=(substr(t,1,length(tag))==tag&&(t==tag||(n!=""&&n!="."&&n!="-"&&!(n>="0"&&n<="9")&&index("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",n)==0))); if(on){sub(/\r$/,"");print;next}} on{sub(/\r$/,"");print}' docs/updatelog.md)"
          if [ -z "$section" ]; then
            echo "docs/updatelog.md 中未找到标签 $GITHUB_REF_NAME 对应的版本章节" >&2
            exit 1
          fi
          {
            echo "## 更新日志"
            echo
            printf '%s\n' "$section"
            echo
            printf '%s\n' \
              '## 平台运行说明' \
              '' \
              '- **Windows**：解压后直接运行 campus-auth.exe（GUI 程序，无控制台窗口，自动打开浏览器 Web 控制台）' \
              '- **macOS**：浏览器下载的二进制带 quarantine 属性，Gatekeeper 会拦截，首次运行前先执行 `xattr -cr campus-auth`（或对解压后的整个目录 `xattr -cr .`）；解压用 `tar -xzf`' \
              '- **Linux**：二进制动态链接 GTK3 / libayatana-appindicator / librsvg（托盘），最小系统需先安装运行时库，Debian/Ubuntu：`sudo apt install libgtk-3-0 libayatana-appindicator3-1 librsvg2-2`；解压用 `tar -xzf`，执行 `./campus-auth`' \
              '- **Linux ARM64**：同上依赖；构建于 ubuntu-24.04（glibc 较新），老发行版（Debian 11/Ubuntu 20.04 及更早）可能因 glibc 过旧无法运行，建议 Debian 12+/Ubuntu 22.04+；树莓派 OS（64 位）可直接运行' \
              "- **Docker**：预构建多架构镜像为 \`ghcr.io/misyra/campus-auth-rs:$GITHUB_REF_NAME\`，\`prerelease\` 指向最新测试版，正式版更新 \`latest\`" \
              '- 各平台 .sha256 为对应压缩包的 SHA256 校验文件'
          } > /tmp/release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md "${release_flags[@]}" || \
              gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  docker:
    name: 构建 Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    env:
      IMAGE_NAME: ghcr.io/misyra/campus-auth-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 构建并推送架构镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}

  docker-manifest:
    name: 发布 Docker 多架构清单
    needs: [build, docker]
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: ghcr.io/misyra/campus-auth-rs
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 合并并校验多架构镜像
        shell: bash
        run: |
          mutable_tag="latest"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            mutable_tag="prerelease"
          fi
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$GITHUB_REF_NAME" \
            --tag "$IMAGE_NAME:$mutable_tag" \
            "$IMAGE_NAME:$GITHUB_REF_NAME-amd64" \
            "$IMAGE_NAME:$GITHUB_REF_NAME-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_REF_NAME"
