name: Release

# 便携版发布流水线：推送 v* 标签触发，三平台产物直接上传到 GitHub Release。
#
# 产物与 build.ps1 口径一致（解压即用）：
#   campus-auth(-helper)(.exe)  # 主程序（前端已嵌入）+ 更新替换助手
#   resources/                  # 托盘图标 / task-recorder 等静态资源
#   python_worker/              # Python Worker 源码（运行时按需引导 uv 环境）
#
# 矩阵：Windows x64 / Windows arm64（MSVC 目标由 windows runner 自带工具链交叉编译）/
# macOS arm64 / macOS x64（Apple Silicon 主机交叉编译，规避 Intel 云主机退役风险）/
# Linux x64（ubuntu-22.04，较旧 glibc 兼容更多发行版）。
# 注：不产 linux-arm64 产物——tray-icon 后端动态链接 GTK，aarch64 交叉链接缺 GTK 库，
# 且 updater 的 linux-arm64 平台键保留（将来补充产物即生效）。

on:
  push:
    tags: ["v*"]

# gh release create/upload 需要写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

    env:
      RELEASE_TARGET: ${{ matrix.target }}
      ARCHIVE: campus-auth-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 读取 Rust 工具链版本
        id: rust-toolchain
        shell: pwsh
        run: |
          $config = Get-Content rust-toolchain.toml -Raw
          if ($config -notmatch 'channel\s*=\s*"([^"]+)"') {
            throw "rust-toolchain.toml 缺少 toolchain.channel"
          }
          "channel=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      # tray-icon 的 Linux 后端链接 GTK3 / appindicator / xdo（muda 菜单模拟点击），
      # 构建期需要 -dev 头文件
      - name: 安装 Linux 托盘构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 默认特性的 rust-embed 编译需要 frontend/dist；嵌入必须走真实生产构建
      - name: 构建前端资源
        working-directory: frontend
        run: npm ci && npm run build

      # 版本号规范（AGENTS.md）：tag 与 Cargo.toml 必须一致，防错 tag 发错版
      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $cargo) { throw "Cargo.toml 缺少 version 字段" }
          if ($tag -ne $cargo) {
            throw "tag $env:GITHUB_REF_NAME 与 Cargo.toml version=$cargo 不一致，请先同步版本号"
          }

      - name: Release 构建
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 组装口径与 build.ps1 一致；额外排除 __pycache__（运行时自动再生）
      - name: 组装便携包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "pkg"
          New-Item -ItemType Directory -Path "$out/python_worker" | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/campus-auth.exe" $out
          Copy-Item "target/$env:RELEASE_TARGET/release/campus-auth-helper.exe" $out
          Copy-Item "resources" "$out/resources" -Recurse
          New-Item -ItemType Directory -Path "$out/docs/guides" -Force | Out-Null
          Copy-Item "docs/guides/*.md" "$out/docs/guides" -Force
          Get-ChildItem "python_worker" -Force | Where-Object { $_.Name -ne ".venv" } |
            ForEach-Object { Copy-Item $_.FullName (Join-Path "$out/python_worker" $_.Name) -Recurse -Force }
          Get-ChildItem "$out/python_worker" -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Compress-Archive -Path "$out/*" -DestinationPath $env:ARCHIVE

      - name: 组装便携包（macOS / Linux）
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/python_worker
          cp "target/$RELEASE_TARGET/release/campus-auth" pkg/
          cp "target/$RELEASE_TARGET/release/campus-auth-helper" pkg/
          cp -R resources pkg/resources
          mkdir -p pkg/docs/guides && cp docs/guides/*.md pkg/docs/guides/
          tar -C python_worker --exclude=.venv --exclude=__pycache__ -cf - . | tar -C pkg/python_worker -xf -
          tar -czf "$ARCHIVE" -C pkg .

      # 生成 SHA256 校验文件（更新器按 SHA 校验完整性的前置数据）；mac 无 sha256sum，回退 shasum
      - name: 生成 SHA256
        if: runner.os != 'Windows'
        run: (sha256sum "$ARCHIVE" 2>/dev/null || shasum -a 256 "$ARCHIVE") > "$ARCHIVE.sha256"

      - name: 生成 SHA256（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower()
          # -NoNewline：与 sha256sum 标准两空格格式对齐，避免 CRLF 干扰校验工具
          [System.IO.File]::WriteAllText("$env:ARCHIVE.sha256", "$hash  $env:ARCHIVE")

      # Release 创建存在并发竞态（五个 job 同时打首个包）：
      # create 失败仅可能是"已存在"，容忍后由 upload 继续幂等上传（--clobber 可重跑覆盖）
      # 发布说明 = 本版更新日志（docs/changelog.md 对应章节）+ 三端运行前提；
      # 五个 job 算出同一份内容，首个 create 生效（macOS quarantine 指引 W9、Linux GTK 依赖 W8）
      - name: 上传到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          section="$(awk -v tag="$GITHUB_REF_NAME" '/^## /{t=substr($0,4); n=substr(t,length(tag)+1,1); on=(substr(t,1,length(tag))==tag&&(t==tag||(n!=""&&n!="."&&n!="-"&&!(n>="0"&&n<="9")&&index("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",n)==0))); if(on){sub(/\r$/,"");print;next}} on{sub(/\r$/,"");print}' docs/changelog.md)"
          {
            echo "## 更新日志"
            echo
            if [ -n "$section" ]; then printf '%s\n' "$section"; else echo "见仓库 docs/changelog.md"; fi
            echo
            printf '%s\n' \
              '## 平台运行说明' \
              '' \
              '- **Windows**：解压后直接运行 campus-auth.exe（GUI 程序，无控制台窗口，自动打开浏览器 Web 控制台）' \
              '- **macOS**：浏览器下载的二进制带 quarantine 属性，Gatekeeper 会拦截，首次运行前先执行 `xattr -cr campus-auth`（或对解压后的整个目录 `xattr -cr .`）；解压用 `tar -xzf`' \
              '- **Linux**：二进制动态链接 GTK3 / libayatana-appindicator / librsvg（托盘），最小系统需先安装运行时库，Debian/Ubuntu：`sudo apt install libgtk-3-0 libayatana-appindicator3-1 librsvg2-2`；解压用 `tar -xzf`，执行 `./campus-auth`' \
              '- 各平台 .sha256 为对应压缩包的 SHA256 校验文件'
          } > /tmp/release-notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md || true
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
