name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取 Rust 工具链版本
        id: rust-toolchain
        shell: pwsh
        run: |
          $config = Get-Content rust-toolchain.toml -Raw
          if ($config -notmatch 'channel\s*=\s*"([^"]+)"') {
            throw "rust-toolchain.toml 缺少 toolchain.channel"
          }
          "channel=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: 安装 Rust 工具链（rustfmt + clippy）
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      # 固定 rust-cache v2.9.2，缓存 Cargo registry 与 target 编译产物。
      # 对只改 Python/前端或小幅 Rust 改动的连续 PR 提交收益最大。
      - name: 恢复 Rust 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # 最便宜的 Rust 检查优先执行，格式错误无需继续安装 Node/Python 或编译依赖。
      - name: 格式检查（cargo fmt --check）
        run: cargo fmt --check

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python_worker/uv.lock

      # rust-embed 编译需要 frontend/dist 存在，故前端构建先行
      - name: 前端构建（vue-tsc 类型检查 + vite build）
        working-directory: frontend
        run: npm ci && npm run build

      # 复用上一步的 node_modules
      - name: 前端单元测试（vitest）
        working-directory: frontend
        run: npm test

      - name: Clippy 零警告（-D warnings）
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元与集成测试
        run: cargo test

      - name: Python Worker 语法检查
        run: python -m compileall python_worker

      - name: Python Worker 单元测试
        working-directory: python_worker
        run: uv sync --dev --frozen && uv run pytest
